name: Tests

on:
  pull_request:
    branches: [master]
  push:
    # master too, so it has its own Blender cache: PRs into master and the
    # tag-triggered release build can read master's cache, not develop's.
    branches: [develop, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        blender-version: ["4.2", "4.3", "4.4", "4.5", "5.0", "5.1", "5.2", "5.3"]
        exclude:
          # blender-downloader (pip, latest 1.0.5) can't resolve macOS builds
          # for 5.0+: Blender dropped macOS x64 dmgs from 5.0 onward and
          # ships arm64-only, which this version of the tool doesn't parse.
          # Linux is unaffected. Re-include once upstream is fixed:
          # https://github.com/mondeja/blender-downloader/issues
          - os: macos-15
            blender-version: "5.0"
          - os: macos-15
            blender-version: "5.1"
          - os: macos-15
            blender-version: "5.2"
          - os: macos-15
            blender-version: "5.3"
    steps:
      - uses: actions/checkout@v3
        with:
          path: ${{ github.event.repository.name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Cache Blender ${{ matrix.blender-version }}
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-download
          key: blender-${{ matrix.blender-version }}-${{ matrix.os }}

      - name: Download Blender ${{ matrix.blender-version }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p blender-download
          pip install blender-downloader
          # download.blender.org occasionally refuses a request (HTTP 403); retry with a pause.
          for attempt in 1 2 3 4; do
            if blender-downloader ${{ matrix.blender-version }} --extract --quiet --output-directory blender-download; then
              exit 0
            fi
            rm -rf blender-download/*
            if [ "$attempt" -lt 4 ]; then
              echo "::warning::Blender ${{ matrix.blender-version }} download failed (attempt $attempt of 4), retrying in $((attempt * 30))s"
              sleep $((attempt * 30))
            fi
          done
          echo "::error::Could not download Blender ${{ matrix.blender-version }} after 4 attempts"
          exit 1

      - name: Locate Blender executable
        id: blender
        run: |
          EXE=$(find blender-download -type f -iname blender | head -n 1)
          if [ -z "$EXE" ]; then
            echo "Could not find a Blender executable under blender-download/" >&2
            exit 1
          fi
          chmod +x "$EXE"
          echo "executable=$EXE" >> "$GITHUB_OUTPUT"

      - name: Run test suite
        run: python3 ${{ github.event.repository.name }}/tests/run_tests.py --blender "${{ steps.blender.outputs.executable }}"
